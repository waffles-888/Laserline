<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laserline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="main">
<h1 class="title">Laserline</h1>
<canvas id="laserCanvas" width="800" height="600"></canvas>
<button type="button" id="playPauseButton" class="btn-solid theme-inverse">Play/Pause</button>
<input type="range" id="volumeSlider" class="volumeSlider" min="0" max="100" value="50" step="1">
<span id="volumeSliderValue">50</span>%
<input type="range" id="seekBar" class="seekBar" min = "0" value = "0">
<input type="file" id="fileInput" name="file" accept=".mp3,.wav,.ogg" class="form-control">
<audio id="audioPlayer"></audio>
</div>
<script src="script.js"></script>
</body>
</html>
