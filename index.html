<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laserline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>
<body>
<h1 class="title">Laserline</h1>
<canvas id="laserCanvas" width="800" height="600"></canvas>
<button type="button" id="playPauseButton" class="btn-solid theme-inverse">Play/Pause</button>
<input type="file" id="fileInput" name="file" accept=".mp3,.wav,.ogg" class="form-control">
</body>
</html>
