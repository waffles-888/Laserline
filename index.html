<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laserline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="canvasDiv">
<canvas id="laserCanvas"></canvas>
</div>
<div class="main">
<div class="playSeek">
    <div class="playPauseControls">
        <button type="button" id="playPauseButton" class="playPauseButton">Play</button>
    </div>
    <div class="seekControls">
        <input type="range" id="seekBar" class="seekBar" min="0" value="0" step="0.1">
        <span id="seekTime">0:00</span>
    </div>
</div>
<div class="volFile">
    <div class="volumeControls">
        <input type="range" id="volumeSlider" class="volumeSlider" min="0" max="100" value="50" step="1">
        <span id="volumeSliderValue" class="volumeSliderValue">50</span>%
    </div>
    <div class="fileUpload">
        <input type="file" id="fileInput" name="file" accept=".mp3,.wav,.ogg" class="form-control">
    </div>
</div>
<img id="coverArt" src="">
<audio id="audioPlayer"></audio>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="script.js"></script>
</body>
</html>
